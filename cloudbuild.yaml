steps:
  # Build the Docker image
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/jendee-ai:$COMMIT_SHA
      - -t
      - gcr.io/$PROJECT_ID/jendee-ai:latest
      - .

  # Push both tags
  - name: gcr.io/cloud-builders/docker
    args: [push, gcr.io/$PROJECT_ID/jendee-ai:$COMMIT_SHA]

  - name: gcr.io/cloud-builders/docker
    args: [push, gcr.io/$PROJECT_ID/jendee-ai:latest]

  # Apply any pending DB migrations before the new image goes live.
  # Uses scripts/migrate.js (plain node + pg) to avoid the prisma/dev ESM issue on Node 18.
  - name: 'node:22-alpine'
    entrypoint: sh
    secretEnv: ['DATABASE_URL']
    args:
      - -c
      - |
        npm ci --prefer-offline --ignore-scripts
        node scripts/migrate.js

  # Deploy to Cloud Run
  # NOTE: --set-secrets replaces ALL secrets; --update-env-vars only adds/updates named vars.
  # All required non-secret env vars are listed here so they survive every deploy.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - jendee-ai
      - --image=gcr.io/$PROJECT_ID/jendee-ai:$COMMIT_SHA
      - --platform=managed
      - --region=us-central1
      - --allow-unauthenticated
      - --memory=1Gi
      - --cpu=1
      - --timeout=3600
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest,AUTH_SECRET=AUTH_SECRET:latest,AUTH_GOOGLE_SECRET=AUTH_GOOGLE_SECRET:latest,CRON_SECRET=CRON_SECRET:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest
      - --remove-env-vars=STRIPE_SECRET_KEY,AUTH_GOOGLE_SECRET
      - --update-env-vars=NODE_ENV=production,PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser,AUTH_URL=https://summontranslator.com,AUTH_TRUST_HOST=true,NEXT_PUBLIC_APP_URL=https://summontranslator.com,RESEND_FROM=Summon Translator <support@summontranslator.com>,AUTH_GOOGLE_ID=31067192249-i0vmagqo3bff0qna369bfdm5l1h6fr9h.apps.googleusercontent.com

  # Create or update the Cloud Scheduler job that triggers daily job cleanup.
  # Runs at 03:00 UTC every day; deletes requester jobs older than 7 days.
  # Uses create-or-update pattern: tries create first, falls back to update
  # if the job already exists (avoids delete+create race and permission issues).
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        CRON_SECRET=$$(gcloud secrets versions access latest --secret=CRON_SECRET --project=$PROJECT_ID)
        if gcloud scheduler jobs describe cleanup-old-jobs --location=us-central1 --project=$PROJECT_ID --quiet 2>/dev/null; then
          echo "Scheduler job already exists — skipping"
        else
          echo "Scheduler job not found — creating"
          gcloud scheduler jobs create http cleanup-old-jobs \
            --schedule="0 3 * * *" \
            --uri="https://summontranslator.com/api/cron/cleanup-jobs" \
            --message-body="{}" \
            --headers="Content-Type=application/json" \
            --headers="Authorization=Bearer $${CRON_SECRET}" \
            --time-zone="UTC" \
            --location=us-central1 \
            --project=$PROJECT_ID
        fi

availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
    env: DATABASE_URL

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
